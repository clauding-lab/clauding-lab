<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110f"/>
      <stop offset="1" stop-color="#1a1714"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- gauge motif (Clauge = Claude + gauge) -->
  <g stroke-linecap="round">
    <!-- track -->
    <path d="M 884 250 A 116 116 0 0 1 1116 250" fill="none" stroke="#2c2622" stroke-width="14"/>
    <!-- value arc ~72% (Claude clay) -->
    <path d="M 884 250 A 116 116 0 0 1 1074 161" fill="none" stroke="#d97757" stroke-width="14"/>
    <!-- needle -->
    <line x1="1000" y1="250" x2="1062" y2="174" stroke="#f4ece4" stroke-width="3"/>
  </g>
  <circle cx="1000" cy="250" r="7" fill="#f4ece4"/>
  <circle cx="1000" cy="250" r="3" fill="#14110f"/>
  <!-- model-accent legend dots: opus / sonnet / haiku -->
  <circle cx="958" cy="300" r="4" fill="#b59cdc"/>
  <circle cx="1000" cy="300" r="4" fill="#84a8d4"/>
  <circle cx="1042" cy="300" r="4" fill="#9bc89a"/>

  <!-- left content -->
  <rect x="64" y="68" width="52" height="3" fill="#d97757"/>
  <text x="64" y="99" font-size="13.5" letter-spacing="2.5" fill="#8a7e74">CLAUDE CODE · TOKEN ANALYTICS &amp; SUBSCRIPTION ROI</text>
  <text x="61" y="184" font-size="76" font-weight="700" fill="#f4ece4">Clau<tspan fill="#d97757">ge</tspan></text>
  <text x="64" y="230" font-size="22" fill="#c9bdb2">Know what your AI-assisted coding actually costs.</text>
  <text x="64" y="300" font-size="14.5" fill="#8a7e74">github.com/clauding-lab/clauge</text>
</svg>
