<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0c1a3d"/>
      <stop offset="1" stop-color="#0e2a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.12" r="0.65">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- accent rule -->
  <rect x="64" y="40" width="48" height="3" fill="#38bdf8"/>
  <!-- title -->
  <text x="62" y="98" font-size="52" font-weight="700" fill="#ffffff">CIB<tspan fill="#38bdf8">x</tspan>Ray</text>
  <!-- subtitle -->
  <text x="66" y="126" font-size="12.5" letter-spacing="4" fill="#7e9cc4">CREDIT BUREAU INTELLIGENCE</text>
  <!-- tagline (2 lines) -->
  <text x="64" y="162" font-size="16" fill="#cfe0f5">Bangladesh Bank CIB reports → credit score, analytics &amp; audit-ready exports —</text>
  <text x="64" y="186" font-size="16" fill="#cfe0f5">parsed, scored, and exported <tspan font-weight="700" fill="#ffffff">entirely on your machine</tspan>.</text>

  <!-- stat cards -->
  <g>
    <rect x="64"  y="214" width="250" height="86" rx="9" fill="#0b1f44" stroke="#244e76" stroke-width="1"/>
    <text x="84"  y="258" font-size="30" font-weight="700" fill="#38bdf8">0–100</text>
    <text x="84"  y="282" font-size="12" fill="#9db8d6">Transparent, rule-based score</text>

    <rect x="338" y="214" width="250" height="86" rx="9" fill="#0b1f44" stroke="#244e76" stroke-width="1"/>
    <text x="358" y="258" font-size="30" font-weight="700" fill="#38bdf8">9</text>
    <text x="358" y="282" font-size="12" fill="#9db8d6">Analysis tabs per report</text>

    <rect x="612" y="214" width="250" height="86" rx="9" fill="#0b1f44" stroke="#244e76" stroke-width="1"/>
    <text x="632" y="258" font-size="30" font-weight="700" fill="#38bdf8">5</text>
    <text x="632" y="282" font-size="12" fill="#9db8d6">Export formats · xlsx · docx · pdf · json</text>

    <rect x="886" y="214" width="250" height="86" rx="9" fill="#0b1f44" stroke="#244e76" stroke-width="1"/>
    <text x="906" y="258" font-size="30" font-weight="700" fill="#38bdf8">100%</text>
    <text x="906" y="282" font-size="12" fill="#9db8d6">Client-side · no data leaves the device</text>
  </g>
</svg>
